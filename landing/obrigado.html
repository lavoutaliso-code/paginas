<style>@font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url('fontes/Geist-400.ttf') format('truetype')}@font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url('fontes/Geist-500.ttf') format('truetype')}@font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url('fontes/Geist-700.ttf') format('truetype')}
:root{--fundo:#EFEFEF;--papel:#fff;--tinta:#1C1C1E;--tinta-2:#656C79;
  --cinza-ref:#6B6B6B;--preto-ref:#3E3E3E;
  --lala:#FF90C6;--lala-claro:#FFF1F7;--lala-fio:#FFD3E8;--lala-esc:#C2005E;
  --verde:#17A16A;--verde-claro:#E8F7F0;--verde-esc:#11784F;--col:430px}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Geist',-apple-system,system-ui,sans-serif;
  background:var(--fundo);color:var(--tinta);line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.col{width:var(--col);max-width:100%;margin:0 auto;padding:0 20px}
.festa{--nuvem:356px;position:relative;padding-top:46px;padding-bottom:10px;
  text-align:center}
.lalafoto{position:relative;z-index:2;width:56%;max-width:200px;aspect-ratio:1;
  margin:0 auto;border-radius:50%;display:block;
  box-shadow:0 0 0 6px #fff,0 2px 6px rgba(20,22,26,.12),
    0 20px 36px -16px rgba(43,10,26,.5)}
.confete{position:absolute;left:0;right:0;top:0;height:var(--nuvem);
  pointer-events:none;z-index:1}
.confete i{position:absolute;display:block;opacity:.92}

/* ⭐ "mais clean": o título desceu de 800 pra 700 e o letter-spacing
   afrouxou de -.045em pra -.03em. Menos peso e mais ar. */
h1{position:relative;z-index:3;margin-top:26px;
  font-size:clamp(27px,8.2vw,32px);line-height:1.1;letter-spacing:-.03em;
  font-weight:700}
h1 em{font-style:normal;color:var(--lala-esc)}
.sub{position:relative;z-index:3;font-size:14.5px;line-height:20px;
  color:var(--cinza-ref);margin:12px auto 0;max-width:31ch;font-weight:400}

.redondo{appearance:none;border:0;cursor:pointer;display:grid;place-items:center;
  width:70px;height:70px;border-radius:50%;margin:30px auto 0;
  background:var(--preto-ref);color:#fff;
  box-shadow:0 6px 14px rgba(20,22,26,.2),0 20px 34px -16px rgba(20,22,26,.6)}
.redondo .st{width:26px;height:26px}
.redondo:active{transform:scale(.95)}
.sobredondo{display:block;font-size:12.5px;color:var(--cinza-ref);margin-top:12px;
  font-weight:400}

.escondido{position:absolute;left:-9999px}
.secao-form{padding-top:6px;padding-bottom:40px}
.campo{display:block;margin-top:16px;text-align:left}
.campo .rot{display:block;font-size:13.5px;font-weight:600;color:var(--tinta);
  letter-spacing:-.01em}
.campo .dica{display:block;font-size:12.5px;color:var(--tinta-2);margin-top:3px;
  line-height:1.35;font-weight:400}
.campo input,.campo select{width:100%;margin-top:8px;font:inherit;
  font-size:16px;font-weight:400;color:var(--tinta);background:#fff;
  border:1.5px solid #DFDFE5;border-radius:13px;padding:12px 14px;
  min-height:50px;appearance:none}
.campo select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8' fill='none'><path d='M1.5 1.5 6 6 10.5 1.5' stroke='%23656C79' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;
  background-size:12px 8px;padding-right:36px}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--lala);
  box-shadow:0 0 0 3px var(--lala-claro)}
/* 19px/700: branco sobre #17A16A dá 3,31:1, que só passa como texto grande */
.enviar{display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;margin-top:22px;appearance:none;border:0;cursor:pointer;
  background:var(--verde);color:#fff;font:inherit;font-size:19px;
  font-weight:700;letter-spacing:-.015em;border-radius:16px;padding:16px 18px;
  min-height:54px;
  box-shadow:0 2px 6px rgba(23,161,106,.3),0 16px 30px -14px rgba(23,161,106,.8)}
.enviar .rl{width:21px;height:21px;flex:none}
.sob{display:block;text-align:center;font-size:12.5px;color:var(--tinta-2);
  margin-top:11px;line-height:1.45;font-weight:400}
.zapbt{display:flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;color:var(--verde-esc);background:var(--verde-claro);
  border-radius:15px;padding:14px 16px;min-height:50px;margin-top:16px;
  box-shadow:inset 0 0 0 1.5px #BDE8D6}
.zapbt .wz{width:20px;height:20px;flex:none}
.zapbt b{font-size:14.5px;font-weight:600}
@media (max-width:360px){.col{padding:0 15px}}

yle="left:85.7%;top:18.7%;width:9px;height:9px;background:#A84878;transform:rotate(51deg);border-radius:1.5px;"></i><i style="left:25.7%;top:20.3%;width:10px;height:9px;background:#90C060;transform:rotate(15deg);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;"></i><i style="left:20.5%;top:6.9%;width:9px;height:13px;background:#60A8D8;transform:rotate(-16deg);border-radius:1.5px;"></i><i style="left:18.8%;top:28.8%;width:10px;height:9px;background:#E8C84A;transform:rotate(3deg);border-radius:1.5px;"></i><i style="left:40.5%;top:79.0%;width:6px;height:11px;background:#D87860;transform:rotate(64deg);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;"></i><i style="left:57.5%;top:1.8%;width:9px;height:13px;background:#D86060;transform:rotate(55deg);border-radius:1.5px;"></i><i style="left:74.4%;top:87.5%;width:10px;height:11px;background:#D84860;transform:rotate(36deg);border-radius:1.5px;"></i><i style="left:83.5%;top:30.9%;width:7px;height:13px;background:#A84878;transform:rotate(-13deg);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;"></i></div>

  <h1>A sua Lalá<br><em>já começou a nascer</em>.</h1>
  <p class="sub">Pagamento confirmado<span data-nome></span>. Em até 7 dias ela
  está no WhatsApp do seu salão, com os seus serviços e os seus preços.</p>
  <button type="button" class="redondo" aria-label="ir para o formulário"><svg class="st" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <span class="sobredondo">falta só você me contar 3 coisas</span>
</div>
<div class="secao-form">
  <form class="form" id="form" name="lala-implantacao" method="POST"
      data-netlify="true" netlify-honeypot="deixe-vazio" action="/pronto.html">
  <input type="hidden" name="form-name" value="lala-implantacao">
  <p class="escondido"><label>não preencha: <input name="deixe-vazio"></label></p>
  <input type="hidden" name="comprador" id="comprador">
  <input type="hidden" name="email" id="email_oculto">
  <input type="hidden" name="pedido" id="pedido">
  <label class="campo" for="negocio"><span class="rot">Nome do seu salão</span><span class="dica">como a sua cliente conhece</span><input id="negocio" name="negocio" type="text" required autocomplete="off"></label><label class="campo" for="zap_dona"><span class="rot">Seu WhatsApp</span><span class="dica">é nesse número que o suporte vai te ligar</span><input id="zap_dona" name="zap_dona" type="tel" required autocomplete="off"></label><label class="campo" for="horario"><span class="rot">Melhor horário pra te ligar</span><select id="horario" name="horario" required><option value="" disabled selected>escolha</option><option value="manhã">manhã</option><option value="início da tarde">início da tarde</option><option value="fim da tarde">fim da tarde</option><option value="qualquer horário">qualquer horário</option></select></label>

  montar a sua Lalá.</span>
</form>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  function pega(){ for (var i=0;i<arguments.length;i++){
      var v = q.get(arguments[i]); if (v) return v; } return ''; }
  var nome  = pega('name','nome','customer_name','full_name');
  var email = pega('email','customer_email');
  /* ⚠️ A KIWIFY MANDA `order_code`, NÃO `order_id`. Medido em 15/10/2026 no
     referrer do único envio real deste formulário (13/10, Danny Sobrancelhas):
     .../obrigado?token=…&order_code=bL6yEC2&amount=NaN&payment_type=cartao
     Como a lista não tinha `order_code`, o campo `pedido` foi gravado VAZIO e
     o cartão só casou de raspão, pelos 8 últimos dígitos do telefone. */
  var ped   = pega('order_code','order_id','order','pedido','transaction_id');
  var c = document.getElementById('comprador');    if (c) c.value = nome;
  var e = document.getElementById('email_oculto'); if (e) e.value = email;
  var p = document.getElementById('pedido');       if (p) p.value = ped;
  if (nome) {
    var alvo = document.querySelector('[data-nome]');
    if (alvo) alvo.textContent = ', ' + nome.trim().split(/\s+/)[0];
  }
  var bt = document.querySelector('.redondo');
  if (bt) bt.addEventListener('click', function(){
    var f = document.getElementById('form');
    if (f) f.scrollIntoView({behavior:'smooth', block:'start'});
  });
})();
</script>
