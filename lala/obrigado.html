<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAFB">
<title>Lalá — a recepcionista que agenda 24h por dia</title>
<meta name="description" content="Ela responde no WhatsApp, oferece o horário que a agenda tem, cobra o sinal e registra o agendamento sozinha.">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<style>
/* ── a fonte do mockup aprovado, servida daqui ─────────────────────────
   Fallback de fonte quebra a régua inteira e faz perseguir um erro que
   não existe no CSS. Por isso o Poppins vem no pacote, não do Google. */
@font-face{font-family:Poppins;src:url(fontes/poppins-400.woff2)format('woff2');
  font-weight:400;font-display:block}
@font-face{font-family:Poppins;src:url(fontes/poppins-600.woff2)format('woff2');
  font-weight:600;font-display:block}
@font-face{font-family:Poppins;src:url(fontes/poppins-700.woff2)format('woff2');
  font-weight:700;font-display:block}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
/* ⚠️ SEM `-webkit-font-smoothing:antialiased`. Ele estava aqui por reflexo e
   engordou/afinou cada glifo: com a caixa do texto BATENDO até a 2ª casa
   (x,y,w,h idênticos ao mockup), o diff da tela 2 ainda dava 1,56%, e os
   pixels diferentes eram todos dentro das letras. O mockup aprovado não usa,
   então usar aqui é desenhar outra tela com a mesma medida. */
body{font-family:Poppins,-apple-system,sans-serif;color:#1C1033;background:#FF7FB5;
  overscroll-behavior:none}

/* as 3 telas empilhadas; uma de cada vez */
.tela{position:fixed;inset:0;overflow:hidden;opacity:0;pointer-events:none;
  transition:opacity .45s ease}
.tela.ver{opacity:1;pointer-events:auto}

/* ⚠️ EM JANELA LARGA O APP VIVIA ESTICANDO A ARTE. Medido em 24/09/2026:
   num Safari de Mac (1440x900 @2x) o fundo era desenhado com 2880 pixels de
   aparelho a partir de uma imagem de 1290 — ampliação de 2,2x, e ela leu como
   "continua sem qualidade". No iPhone a MESMA imagem é reduzida (1290 de
   origem para 1170 de tela = 1,10) e sai nítida.
   Ou seja: não era o arquivo, era o tamanho do palco. Acima de 520px o app
   passa a viver num quadro do tamanho de um telefone — que é o tamanho pra
   que a arte foi feita. No celular nada disto vale. */
@media (min-width:520px){
  html,body{background:#E8E3E0}
  .tela{inset:auto;left:50%;top:50%;width:430px;height:min(932px,94vh);
    transform:translate(-50%,-50%);border-radius:46px;
    box-shadow:0 0 0 2px #fff, 0 40px 80px -30px rgba(20,22,26,.5)}
}

/* ── tela 1 e 2: a arte da referência ────────────────────────────────── */
/* ⚠️ AQUI ERA UMA FOTO DE TELA CHEIA. Ela pediu: "deixe aparecer só o fundo da
   cor dela, e ela em cima com fundo transparente" — porque ao recarregar a foto
   entrava em passada grossa antes de ficar boa.
   Agora o céu é COR, não imagem: pinta no primeiro quadro, sem passada nenhuma,
   e é nítido em qualquer tamanho de tela porque não tem pixel.
   As paradas foram AMOSTRADAS da arte (mediana dos pixels de fundo por linha,
   ignorando a nuvem branca e o cinza dela) — não estimadas no olho. */
.ceu{background:linear-gradient(180deg,#FB7EBE 0%,#FC84C0 25%,#FC91C9 50%,
  #FCA5D4 75%,#FCB1DB 100%)}
/* ⚠️ A robô é recorte de LARGURA CHEIA: os braços dela tocam as duas bordas da
   arte, e qualquer esfumado lateral cortaria braço. Como a peça cobre a tela
   toda na horizontal, não existe emenda lateral — só topo e base, esfumados
   até alfa 0 em cima de rosa liso (salto medido: 0 níveis). */
.robo{position:absolute;left:0;width:100%;height:auto;display:block}
/* a carinha dela fica a 24,3% da altura DO RECORTE. Os `top` abaixo põem a
   carinha em 45,2% da tela (capa) e 22,7% (boas-vindas) — os mesmos lugares da
   arte original, medidos, para nada se mexer de posição. */
.r1{top:32.3%}
.r2{top:10%}

/* ── tela 2: o card branco ───────────────────────────────────────────── */
.cartao{position:absolute;left:0;right:0;bottom:0;height:371px;background:#fff;
  border-radius:38px 38px 0 0;padding:52px 34px 0;text-align:center}
.cartao b{display:block;font-size:24px;font-weight:700;letter-spacing:-.035em;line-height:1.15}
.cartao span{display:block;font-size:14px;color:#6E6E79;margin-top:11px;line-height:1.5}
.botao{margin:44px auto 0;width:196px;height:52px;border-radius:26px;display:grid;
  place-items:center;font-size:15.5px;font-weight:600;
  background:linear-gradient(90deg,#FF7FB5,#FFB3D9);color:#3A0D24;
  box-shadow:0 12px 24px -10px rgba(0,0,0,.28);cursor:pointer}
.botao:active{transform:scale(.97)}

/* ── tela 3: a home ──────────────────────────────────────────────────── */
/* ⚠️ NADA de position:absolute aqui. A primeira versão do mockup usava
   inset:0 e o quadro mais alto não revelava mais conteúdo — revelava fundo
   vazio, e os anéis escapavam da largura. Fluxo normal + overflow no pai. */
.homer{background:#FAFAFB;overflow-y:auto;-webkit-overflow-scrolling:touch;height:100%}
.rolo{padding:58px 18px 26px;min-height:100%;max-width:460px;margin:0 auto}
/* ⚠️ Em tela cheia o topo da página JÁ começa abaixo do relógio (status bar
   `default`), então os 58px do mockup — que contavam com a barra desenhada
   dentro dos 844 — viram espaço sobrando. Só no app o topo encolhe. */
/* ⚠️ São dois seletores pro mesmo caso, de propósito. O `@media` é o jeito
   certo — mas o iPhone antigo só tem `navigator.standalone`, e nenhum motor de
   teste deste Mac consegue fingir `display-mode: standalone` (tentado: o
   `matchMedia` continua falso). A classe `.app`, posta pelo JS, é a versão que
   dá pra provar; o media query é a que não depende de o JS rodar. */
@media (display-mode:standalone){
  .rolo{padding-top:calc(env(safe-area-inset-top,0px) + 22px);
        padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
}
html.app .rolo{padding-top:calc(env(safe-area-inset-top,0px) + 22px);
        padding-bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
.cab{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.marca{font-size:17px;font-weight:600;letter-spacing:-.03em}
.marca b{color:#FF2D87;font-weight:700}
.data{font-size:11px;color:#9A9AA2}

.cartaoLaila{background:linear-gradient(180deg,#FFF0F7,#fff);border-radius:22px;
  padding:14px 16px;display:flex;align-items:center;gap:13px;margin-top:30px;
  box-shadow:0 2px 12px rgba(43,10,26,.06)}
/* ⚠️ O SALTO PRA FORA DO CARTÃO é medalhão e não figura recortada: o recorte
   com alpha foi tentado 4 vezes e sempre deixou artefato (flood fill comia o
   corpo; distância-do-fundo deixava franja felpuda; abertura morfológica comeu
   o corpo inteiro). O círculo é limpo por construção. */
/* ⚠️ MEDIDO: o medalhão vai de x=12 a x=100 (left 12 + 88 de largura). Com
   padding-left:104 sobravam 4px e o "Lalá" encostava nele. 120 dá 20px de
   folga real — e vale pro bloco inteiro, porque o papel e a pílula do
   estado herdam o mesmo recuo. */
.cartaoLaila{position:relative;overflow:visible;padding-left:120px;min-height:86px;
  cursor:pointer}
.foto{position:absolute;left:12px;top:-26px;width:88px;height:88px;border-radius:50%;
  object-fit:cover;flex:none;
  box-shadow:0 0 0 5px #fff, 0 14px 26px -8px rgba(255,45,135,.55)}
.quem b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.papel{display:block;font-size:11px;font-weight:600;color:#FF2D87;
  text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.zap{margin-top:8px;display:inline-flex;align-items:center;gap:6px;background:#E9F7F0;
  color:#17A36A;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600}
.zap i{width:6px;height:6px;border-radius:50%;background:#17A36A}
.zap.off{background:#FDF3E6;color:#C77700}
.zap.off i{background:#C77700}

.trio{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:18px;
  margin-top:9px;padding:12px 0;box-shadow:0 2px 12px rgba(43,10,26,.05)}
.trio div{text-align:center;border-right:1px solid #F2F2F5}
.trio div:last-child{border:0}
.trio b{display:block;font-size:18px;font-weight:700;letter-spacing:-.03em}
.trio span{display:block;font-size:9.5px;color:#9A9AA2;text-transform:uppercase;
  letter-spacing:.07em;margin-top:2px}

.saldo{background:#fff;border-radius:22px;padding:16px;margin-top:9px;
  box-shadow:0 2px 12px rgba(43,10,26,.05)}
/* ⚠️ ordem dela: o card de créditos ENCOLHE e os anéis CRESCEM. Ele deixou de
   ser o herói da tela — quem manda agora são os 4 números do dia. */
.saldo.creditos{padding:13px 14px;border-radius:18px}
.linhaRot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.olho{width:34px;height:34px;margin:-6px -6px -6px 0;flex:none;display:grid;
  place-items:center;color:#9A9AA2;cursor:pointer;border-radius:50%}
.olho svg{width:19px;height:19px}
.olho:active{background:#F2F2F5}
/* ⚠️ `filter:blur` BORRA MAS NÃO APAGA: quem tira print e abre no editor
   recupera o número. Aqui serve pro que ela pediu — o olho de quem está do
   lado — e é por isso que o texto também vira "•" quando escondido: aí não
   sobra pixel nenhum do valor. */
.escondido{filter:blur(9px);user-select:none;pointer-events:none}
.creditos .on{padding:4px 9px;font-size:10px}
.creditos .rot{margin-top:9px;font-size:9.5px}
.creditos .v{font-size:23px;margin-top:2px}
.creditos .de{font-size:10.5px;margin-top:3px}
.creditos .bt{margin-top:10px;height:38px;font-size:13px;border-radius:12px;
  text-decoration:none}
.bt2{margin-top:7px;height:32px;display:grid;place-items:center;border-radius:11px;
  background:#F4F4F7;color:#6B7280;font-size:12px;font-weight:600;cursor:pointer}
.bt2:active{opacity:.7}
#formRec input{width:100%;height:42px;border-radius:12px;border:1.5px solid #E4E4E6;
  padding:0 13px;font-size:14px;font-family:inherit;margin-top:9px;outline:0}
#formRec input:focus{border-color:#FF2D87}
.erroRec{font-size:11px;color:#C4005E;margin-top:6px;min-height:1px}

/* ── tela 4 · créditos (arranjo C) ────────────────────────────────── */
.saldoC{background:#fff;border-radius:22px;padding:17px 18px;margin-top:14px;
  box-shadow:0 2px 12px rgba(43,10,26,.05)}
.saldoC .rot{display:block;font-size:10px;color:#9A9AA2;text-transform:uppercase;
  letter-spacing:.09em}
.saldoC .v{display:block;font-size:34px;font-weight:700;letter-spacing:-.045em;margin-top:4px}
.saldoC .de{display:block;font-size:11.5px;color:#9A9AA2;margin-top:5px;line-height:1.45}
.ext{background:#fff;border-radius:20px;padding:4px 15px;
  box-shadow:0 2px 12px rgba(43,10,26,.05)}
.ex{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid #F3F3F6}
.ex:last-child{border:0}
.ex b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.ex span{display:block;font-size:10.5px;color:#9A9AA2;margin-top:1px}
.ex u{text-decoration:none;font-size:13px;font-weight:600;color:#6B7280;white-space:nowrap}
.ex u.mais{color:#17A36A}
.btP{margin-top:12px;background:#12121A;color:#fff;border-radius:15px;height:50px;
  display:grid;place-items:center;font-size:15px;font-weight:600;cursor:pointer}
.btP:active{opacity:.75}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chips > *{min-width:0}
.chip{background:#fff;border-radius:16px;padding:14px 12px;text-align:center;
  box-shadow:0 0 0 1.5px #EDEDF1 inset;cursor:pointer}
.chip b{display:block;font-size:17px;font-weight:700;letter-spacing:-.035em;white-space:nowrap}
.chip.esc{background:#FFF2F8;box-shadow:0 0 0 2px #FF2D87 inset}
.chip.esc b{color:#C4005E}
.outro{margin-top:10px}
.outro span{display:block;font-size:10.5px;color:#9A9AA2;margin-bottom:6px}
.outro input{width:100%;height:46px;border-radius:13px;border:1.5px solid #E4E4E6;
  padding:0 14px;font-size:17px;font-weight:700;letter-spacing:-.03em;
  font-family:inherit;outline:0}
.outro input:focus{border-color:#FF2D87}
.campos input{width:100%;height:46px;border-radius:13px;border:1.5px solid #E4E4E6;
  padding:0 14px;font-size:14px;font-family:inherit;outline:0;margin-bottom:9px}
.campos input:focus{border-color:#FF2D87}
#voltaCred{cursor:pointer;font-weight:600;color:#FF2D87}
.on{display:inline-flex;align-items:center;gap:6px;background:#F2F8F5;color:#17A36A;
  border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600}
.on i{width:6px;height:6px;border-radius:50%;background:#17A36A}
.saldo .rot{display:block;font-size:10px;color:#9A9AA2;text-transform:uppercase;
  letter-spacing:.08em;margin-top:12px}
.saldo .v{display:block;font-size:31px;font-weight:700;letter-spacing:-.045em;margin-top:3px}
.saldo .de{display:block;font-size:11px;color:#9A9AA2;margin-top:4px;line-height:1.4}
.bt{margin-top:13px;background:#12121A;color:#fff;border-radius:14px;height:46px;
  display:grid;place-items:center;font-size:14px;font-weight:600;cursor:pointer}
.bt:active{opacity:.75}

.secao{font-size:10px;font-weight:700;color:#9A9AA2;text-transform:uppercase;
  letter-spacing:.09em;margin:20px 0 9px}

/* ⚠️ item de grid tem min-width:auto por padrão e NÃO encolhe abaixo do
   conteúdo. Sem o min-width:0 os 4 anéis somaram 471px dentro de um
   telefone de 390 e vazaram pela borda — medido, não visto. */
.aneis{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.aneis > *{min-width:0}
.anel{background:#fff;border-radius:20px;padding:15px 13px;display:flex;align-items:center;
  gap:11px;min-width:0;box-shadow:0 2px 12px rgba(43,10,26,.05)}
.anel > div{min-width:0}
.anel svg{width:50px;height:50px;flex:none}
.anel circle{fill:none;stroke-width:4;stroke-linecap:round}
.anel .trilho{stroke:#F0F0F4}
.anel span{display:block;font-size:9px;color:#9A9AA2;text-transform:uppercase;
  letter-spacing:.07em}
/* ⚠️ o valor cresceu de 16 para 20px, mas SEM tirar o white-space:nowrap nem o
   min-width:0: foi assim que os 4 anéis já somaram 471px num telefone de 390. */
.anel b{display:block;font-size:20px;font-weight:700;letter-spacing:-.04em;margin-top:2px;
  white-space:nowrap}
.nota{font-size:10px;color:#B4B4BC;line-height:1.45;margin-top:8px}
.retorno{margin-top:9px;background:#FFF0F7;border-radius:14px;padding:11px 13px;
  font-size:11.5px;color:#7A3355;line-height:1.4}
.retorno b{color:#FF2D87;font-weight:700}

.lista{background:#fff;border-radius:20px;padding:4px 14px 0;
  box-shadow:0 2px 12px rgba(43,10,26,.05)}
.dia{font-size:9.5px;color:#B4B4BC;text-transform:uppercase;letter-spacing:.09em;
  padding:10px 0 4px}
.ag{display:flex;align-items:center;gap:9px;padding:8px 0}
.ag .h{font-size:11.5px;color:#6E6E79;width:36px;flex:none;font-weight:600}
.pt{width:9px;height:9px;border-radius:50%;flex:none}
.pt.cheio{background:#17A36A}
.pt.aberto{background:#fff;box-shadow:0 0 0 2px #E8A33C inset}
.pt.vazio{background:#fff;box-shadow:0 0 0 2px #DCDCE2 inset}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:13px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.nm span{display:block;font-size:10.5px;color:#9A9AA2;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.ag em{font-style:normal;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:8px;
  flex:none}
.ag .ok{background:#E9F7F0;color:#17A36A}
.ag .aviso{background:#FDF3E6;color:#C77700}
.ag .neutro{background:#F2F2F6;color:#9A9AA2}
.pe{display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid #F2F2F5;margin-top:4px;padding:11px 0;font-size:11.5px;color:#6E6E79}
.pe b{font-size:14px;font-weight:700;color:#17A36A}

.comp{background:#fff;border-radius:20px;padding:6px 14px 14px;
  box-shadow:0 2px 12px rgba(43,10,26,.05)}
/* ⚠️ 66px por coluna era a régua do mockup, onde o total da Lalá era
   "R$ 1.680". O custo real do mês entra com a mesma largura de "R$ 3.045" e os
   dois se encostaram — "R$ 1.343R$ 3.045" saiu colado na tela. 78px separa. */
.cab2,.cl{display:grid;grid-template-columns:1fr 78px 78px;align-items:center;
  padding:9px 0;border-bottom:1px solid #F5F5F8}
.cab2{border-bottom:1px solid #EFEFF3}
.cab2 b,.cl b{text-align:center;font-size:12px}
.cab2 .la{color:#FF2D87;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.cab2 .re{color:#9A9AA2;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.cl span{font-size:12px;color:#4A4A55}
.cl .la{font-weight:700;background:#FFF5FA;border-radius:8px;padding:5px 0}
.cl .re{color:#9A9AA2;font-weight:500}
.cl.total{border:0;padding-top:12px}
.cl.total span{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9A9AA2}
.cl.total .la{font-size:15px;color:#FF2D87}
.cl.total .re{font-size:15px;color:#2B0A1A;font-weight:700}
.econ{margin-top:10px;background:#E9F7F0;border-radius:13px;padding:11px 13px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:#0F7A4E;font-weight:600}
.econ b{font-size:16px;font-weight:700;color:#17A36A}

.suporte{margin-top:14px;background:#17A36A;color:#fff;border-radius:16px;height:50px;
  display:grid;place-items:center;font-size:14.5px;font-weight:600;
  text-decoration:none;cursor:pointer}
.assin{text-align:center;font-size:10px;color:#C4C4CC;margin-top:14px;line-height:1.5}

/* o estado de carregando e o de erro: nenhum número aparece antes de existir */
.vazio{color:#C4C4CC}
.erro{background:#FDECEC;color:#B32020;border-radius:14px;padding:12px 14px;
  font-size:11.5px;line-height:1.45;margin-top:9px}

body{background:#FAFAFB}
/* ⚠️ Ordem dela (24/09): "centralize mais os textos". Centraliza o bloco de
   copy E os rótulos do formulário — rótulo à esquerda com título centrado
   fica torto, e torto o olho vê antes de ler. */
h1,.sub,.chamada,.form label,.pe,.topo{text-align:center}
.form label{letter-spacing:.09em}
.pag{min-height:844px;padding:0 0 34px;background:#FAFAFB}
.pag.cartaoso{background:linear-gradient(180deg,#FB7EBE,#FCA5D4);padding-bottom:26px}
/* ⚠️ RITMO APERTADO DE PROPÓSITO. Com o espaçamento anterior o botão
   terminava em 841 de 844 e o rodapé era cortado em 63px — num formulário,
   botão na beirada é lead perdido. Cada corte abaixo foi medido, não chutado. */
.topo{padding:34px 20px 0}
.topo.claro .marca{color:#fff}
.topo.claro .marca b{color:#fff}
.marca{font-size:17px;font-weight:600;letter-spacing:-.03em}
.marca b{color:#FF2D87;font-weight:700}
h1{font-size:28px;line-height:1.1;letter-spacing:-.04em;font-weight:700;
  margin:12px 20px 0}
h1 em{font-style:normal;color:#FF2D87}
.cartaoso h1{font-size:20px;line-height:1.14;margin:12px 0 0}
/* ⚠️ O D PROMETE CABER NUMA TELA — então cabe, medido. Na primeira versão o
   botão terminava em 1032 de 844 e a promessa do arranjo era falsa. Aqui o
   ritmo é apertado de propósito: leque menor, campos mais baixos, rodapé em
   uma linha. */
.cartaoso .topo{padding-top:34px}
.cartaoso .ficha{margin-top:14px;padding:14px 16px 16px}
.cartaoso .form label{margin-bottom:9px;font-size:10px}
.cartaoso .form input{height:44px;margin-top:5px;font-size:15px}
.cartaoso .btn{height:48px;font-size:14.5px}
.cartaoso .pe{margin-top:8px;font-size:11px}

/* ⚠️ o leque das 3 telas: min-width:0 e a largura vindo de --k, senão as três
   somam mais que o telefone e vazam — já aconteceu com 4 anéis num 390. */
.leque{display:flex;justify-content:center;align-items:flex-end;gap:calc(9px*var(--k));
  margin:14px 0 0;padding:0 14px}
.leque img{width:calc(94px*var(--k));min-width:0;border-radius:calc(16px*var(--k));
  box-shadow:0 1px 3px rgba(20,22,26,.10), 0 16px 34px rgba(20,22,26,.16)}
.leque img:nth-child(2){width:calc(108px*var(--k));z-index:2}
.leque.dentro{margin:0 0 4px;padding:0}
.form{margin:12px 20px 0}
.form.compacto{margin:14px 0 0}
.form label{display:block;font-size:11px;font-weight:700;color:#9A9AA2;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px}
.form input{display:block;width:100%;height:47px;margin-top:6px;border-radius:14px;
  border:1.5px solid #E4E4E6;background:#fff;padding:0 15px;font-size:16px;
  font-family:inherit;color:#1C1033;font-weight:500;letter-spacing:-.01em}
.form input::placeholder{color:#B4B4BC;font-weight:400}
.btn{margin-top:4px;height:54px;border-radius:16px;display:grid;place-items:center;
  background:#12121A;color:#fff;font-size:15.5px;font-weight:600}
.pe{display:block;font-size:11.5px;color:#9A9AA2;text-align:center;margin-top:9px;
  line-height:1.45}
.linha{height:1px;background:#EDEDF1;margin:24px 20px 0}
/* ⚠️ CHAMA-SE `.ficha`, NÃO `.cartao`. No app `.cartao` é o card branco da
   tela de boas-vindas — `position:absolute;bottom:0;height:371px` — e como
   esta página importa a folha do app, o nome igual sequestrou o meu cartão:
   ele nascia colado no rodapé com 371px fixos e o formulário caía pra fora da
   tela. Mesma família do `.aneis` que já virou 471px num telefone de 390. */
.ficha{background:#fff;border-radius:26px;margin:20px 16px 0;padding:18px 18px 20px;
  box-shadow:0 2px 12px rgba(120,10,60,.10), 0 26px 50px rgba(120,10,60,.16)}
.prova{display:flex;gap:13px;align-items:center;margin:20px 20px 0;background:#fff;
  border-radius:20px;padding:13px 14px;box-shadow:0 2px 12px rgba(43,10,26,.06)}
.prova .zap{width:74px;border-radius:11px;flex:none;
  box-shadow:0 1px 3px rgba(20,22,26,.12)}
.prova b{display:block;font-size:14px;font-weight:700;letter-spacing:-.02em}
.prova span{display:block;font-size:11.5px;color:#8E8E93;margin-top:4px;line-height:1.45}

.tela{position:static;opacity:1;height:auto}
@media (min-width:520px){.tela{position:static;transform:none;width:auto;
  height:auto;border-radius:0;box-shadow:none;left:auto;top:auto}}

/* o botão vira <button>: zera o visual de sistema e mantém o mesmo desenho */
button.btn{width:100%;border:0;font-family:inherit;cursor:pointer;-webkit-appearance:none}
button.btn:active{opacity:.8}
